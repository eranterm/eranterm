<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>EranTerm Log Console</title>
<style>
  :root { --bg: #0b0d10; --panel: #111418; --panel2: #161a1f; --line: #232830; --fg: #e3e6eb; --muted: #7d8590; --accent: #3ddc5f; --info: #4fb3ff; --warn: #f0a33a; --error: #f05252; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --panel: #fff; --panel2: #eef0f3; --line: #d9dde3; --fg: #1d2127; --muted: #626b76; --accent: #1a9a3a; --info: #1f6fd1; --warn: #b86e0b; --error: #d23c3c; color-scheme: light; }
  }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px -apple-system, system-ui, sans-serif; }
  nav { display: flex; gap: 4px; padding: 8px 10px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  nav button { border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: none; color: var(--muted); padding: 7px 16px; font-weight: 600; margin-bottom: -1px; }
  nav button.active { background: var(--bg); border-color: var(--line); color: var(--fg); }
  nav #tabActs { color: var(--accent); }
  nav #tabActs.active { box-shadow: inset 0 2px var(--accent); }
  nav .n { margin-left: 6px; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  nav .n.bad { background: color-mix(in srgb, var(--error) 18%, transparent); color: var(--error); }
  header { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header .grow { flex: 1; }
  input, button, select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font: inherit; }
  input[type=search] { width: 240px; }
  button { cursor: pointer; }
  header button:hover { border-color: var(--accent); }
  label { display: flex; gap: 4px; align-items: center; color: var(--muted); white-space: nowrap; }
  label.dbg.on { color: var(--info); }
  .view { flex: 1; overflow: auto; min-height: 0; }
  #out { margin: 0; padding: 8px 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .WARN { color: var(--warn); } .ERROR { color: var(--error); } .DEBUG { color: var(--info); opacity: .85; }
  .count { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { position: sticky; top: 0; background: var(--panel2); text-align: left; font-weight: 600; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: top; user-select: text; }
  td.t { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.d { color: var(--muted); word-break: break-all; }
  .act { display: inline-block; padding: 1px 8px; border-radius: 10px; font-weight: 600; font-size: 11.5px; white-space: nowrap; background: color-mix(in srgb, var(--muted) 15%, transparent); }
  .act.create { color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .act.modify { color: var(--info); background: color-mix(in srgb, var(--info) 15%, transparent); }
  .act.delete { color: var(--error); background: color-mix(in srgb, var(--error) 15%, transparent); }
  .act.run { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
  tr.failed td { background: color-mix(in srgb, var(--error) 7%, transparent); }
  .res.fail { color: var(--error); font-weight: 600; }
  .res.ok { color: var(--accent); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <nav>
    <button id="tabLog" class="active">▤ Log<span class="n" id="nLog"></span></button>
    <button id="tabActs" title="Audit trail: everything you created, changed, deleted or ran">★ Action Log<span class="n" id="nActs"></span></button>
  </nav>

  <section id="logPane" class="view-wrap" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header>
      <input id="q" type="search" placeholder="Filter…" spellcheck="false">
      <select id="lvl"><option value="">All levels</option><option value="WARN|ERROR">Warnings + errors</option><option value="ERROR">Errors</option><option value="DEBUG">Debug</option></select>
      <label><input id="follow" type="checkbox" checked> Follow</label>
      <label class="dbg" title="Also log every internal call (IPC) and extra detail. Off by default and after a restart"><input id="debug" type="checkbox"> Debug level</label>
      <span id="count" class="count"></span>
      <span class="grow"></span>
      <button id="copy">Copy</button>
      <button id="clear">Clear</button>
      <button id="folder" title="Open the log file folder (Settings → Logging)">Log folder</button>
    </header>
    <div class="view"><pre id="out"></pre></div>
  </section>

  <section id="actPane" style="display:flex;flex-direction:column;flex:1;min-height:0" hidden>
    <header>
      <input id="aq" type="search" placeholder="Filter: action, server, name, path…" spellcheck="false">
      <select id="acat"><option value="">All actions</option></select>
      <label><input id="afail" type="checkbox"> Failed only</label>
      <span id="acount" class="count"></span>
      <span class="grow"></span>
      <button id="acopy" title="Copy the shown rows as CSV">Copy CSV</button>
    </header>
    <div class="view">
      <table><thead><tr><th>Time</th><th>Action</th><th>Target</th><th>Details</th><th>Result</th></tr></thead><tbody id="arows"></tbody></table>
      <p id="aempty" class="empty" hidden>No actions yet. Creating, changing or deleting servers, users, groups, scripts and deployments, connecting, and file or maintenance actions show up here.</p>
    </div>
  </section>
  <script src="debug.js"></script>
</body>
</html>
